apiVersion: apps/v1
kind: Deployment
metadata: { name: geofiscal-backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: geofiscal-backend } }
  template:
    metadata: { labels: { app: geofiscal-backend } }
    spec:
      containers:
      - name: api
        image: geofiscal/backend:latest
        ports: [{ containerPort: 8000 }]
